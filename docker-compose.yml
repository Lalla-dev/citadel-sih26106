# ==============================================================================
# Citadel Security Platform - Multi-Container Docker Compose Specification
# Includes Citadel Web Application and Persistent PostgreSQL Relational Backend
# ==============================================================================

services:
  citadel-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: citadel-web
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-citadel_user}:${POSTGRES_PASSWORD:-citadel_demo_password}@postgres:5432/${POSTGRES_DB:-citadel_db}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    image: postgres:15-alpine
    container_name: citadel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-citadel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-citadel_demo_password}
      POSTGRES_DB: ${POSTGRES_DB:-citadel_db}
    volumes:
      - citadel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-citadel_user} -d ${POSTGRES_DB:-citadel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  citadel_pgdata:
    name: citadel_pgdata
